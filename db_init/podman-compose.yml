services:
  postgres:
    image: docker.io/postgres:16
    container_name: bsac-portfolio
    restart: unless-stopped
    environment:
      POSTGRES_USER: USER
      POSTGRES_PASSWORD: PASSWORD
      POSTGRES_DB: bsac-portfolio-db
      PGDATA: /var/lib/postgresql/data/
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z